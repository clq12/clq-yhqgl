name: Android Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 不签名的话 assembleRelease 只会产出 app-release-unsigned.apk，手机上装不上。
      # keystore 与密码放在仓库 Secrets 里，绝不进代码库。
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_B64，本次将产出未签名 APK（无法直接安装）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.jks
          cat > android/keystore.properties <<EOF
          storeFile=../release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "签名材料已就绪"

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease

      # 手动触发（workflow_dispatch）时没有 tag，上面的 Release 上传会被跳过，
      # 以前这种跑法编译完就把 APK 丢掉了。这里统一传一份 artifact，任何触发方式都能下载。
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
          name: ${{ github.ref_name }}
          generate_release_notes: true
