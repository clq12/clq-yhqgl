name: Check Expiring Coupons

# 每小时执行一次（UTC时间）
# 注意：GitHub Actions 使用 UTC 时间
# 如果应用使用北京时间，请根据时差调整 cron 表达式
on:
  schedule:
    - cron: '0 * * * *'
  # 允许手动触发工作流
  workflow_dispatch:

jobs:
  check-expiring:
    name: Check Expiring Coupons
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check expiring coupons
        id: check
        env:
          APP_URL: https://clq-rosy.vercel.app
        run: |
          echo "开始检查即将到期的优惠券..."
          RESPONSE=$(curl -s -w "\n%{http_code}" "$APP_URL/api/check-expiring")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 检查完成"
            echo "result=$BODY" >> $GITHUB_OUTPUT
          else
            echo "❌ 检查失败，HTTP状态码: $HTTP_CODE"
            exit 1
          fi

      - name: Display result
        if: success()
        run: |
          echo "检查结果："
          echo '${{ steps.check.outputs.result }}' | jq '.'

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ 优惠券到期检查失败，请检查配置"
          echo "可能的原因："
          echo "1. 环境变量配置错误"
          echo "2. 应用地址不正确"
          echo "3. WebDAV 或 PushPlus 配置有问题"
